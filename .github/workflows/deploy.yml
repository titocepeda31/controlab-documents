name: Prueba FTPS - Controlab staging

# Ejecucion manual. No publica automaticamente cada cambio.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlab-staging-ftps
  cancel-in-progress: false

jobs:
  test-ftps:
    name: Probar transferencia a cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Crear archivo de comprobacion
        shell: bash
        run: |
          mkdir -p ftps-test/
          printf 'Conexion GitHub Actions FTPS correcta. Repositorio: controlab-documents.\n' > ftps-test/conexion-github-cpanel.txt

      - name: Subir exclusivamente el archivo de prueba
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPS_HOST }}
          username: ${{ secrets.FTPS_USERNAME }}
          password: ${{ secrets.FTPS_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./ftps-test/
          # La cuenta FTP debe tener como raiz public_html/controlab-staging/
          server-dir: ./
          dangerous-clean-slate: false
          state-name: .ftp-deploy-controlab-staging.json
          log-level: standard
