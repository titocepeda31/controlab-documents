name: Validar cifrado de informes
on:
  push:
    branches:
      - main
      - feature/cifrado-informes
      - fix/offline-pwa-sync-diagnostics
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis de PHP y bash
        run: |
          set -euo pipefail
          find mvc/backend mvc/frontend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          bash -n scripts/cpanel_mvc_deploy.sh
      - name: Comprobar cifrado autenticado, manipulación y firma
        run: |
          php mvc/backend/tests/ReportCryptoTest.php
          php mvc/backend/tests/UsuariosTest.php
      - name: Comprobar Javascript de navegador
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const t=fs.readFileSync('mvc/frontend/formulario.html','utf8');const m=t.match(/<script>([\s\S]*?)<\/script>/);if(!m)process.exit(1);fs.writeFileSync('/tmp/controlab.js',m[1]);"
          node --check /tmp/controlab.js
          node --check mvc/frontend/sw.js
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('mvc/frontend/manifest.json','utf8'));if(!m.start_url.includes('/demo/formulario.html')||!m.icons.length||!fs.existsSync('mvc/frontend/icon.svg'))process.exit(1);"
          node mvc/frontend/tests/offline-sw.test.cjs
          node mvc/frontend/tests/menu-firma.test.cjs
          node mvc/frontend/tests/usuarios.test.cjs
          node --check /tmp/controlab-usuarios.js
          node mvc/frontend/tests/planificador.test.cjs
          node --check /tmp/controlab-planificador.js
      - name: Comprobar barreras de despliegue
        run: |
          set -euo pipefail
          grep -Fq 'chmod 0644 "$PUBLIC/$rel"' scripts/cpanel_mvc_deploy.sh
          grep -Fq 'umask 077' scripts/cpanel_mvc_deploy.sh
          grep -Fq 'data_encryption_key' scripts/cpanel_mvc_deploy.sh
          grep -Fq 'plaintextSignatures' scripts/cpanel_mvc_deploy.sh
          grep -Fq 'reportCrypto()->encrypt' mvc/backend/src/Models/Informe.php
          grep -Fq "encryptBytes" mvc/backend/src/Models/Revision.php
          grep -Fq "encryptLegacyLocalData" mvc/frontend/formulario.html
          grep -Fq "secureVersion:1" mvc/frontend/formulario.html

  usuarios_mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test_password
          MARIADB_DATABASE: controlab_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Preparar cliente PDO MySQL
        run: |
          if ! php -m | grep -iq '^pdo_mysql$'; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y php-mysql
          fi
      - name: Validar perfiles y sesiones en MariaDB real
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: controlab_test
          TEST_DB_USER: root
          TEST_DB_PASS: test_password
        run: |
          php mvc/backend/tests/UsuariosMysqlIntegrationTest.php
          php mvc/backend/tests/OrdenTrabajoMysqlIntegrationTest.php
