<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotizaciones | Controlab</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css"><link rel="stylesheet" href="./assets/css/app.css"></head><body><main class="container-xl py-3"><div class="page-header mb-3"><div class="row align-items-center g-2"><div class="col"><div class="page-pretitle">Gestión comercial</div><h1 class="page-title">Cotizaciones</h1></div><div class="col-auto"><button class="btn btn-primary" id="new">+ Nueva</button></div></div></div><div id="notice" role="status" class="text-danger mb-2"></div>
<form id="form" hidden>
<div class="card mb-3"><div class="card-header"><h3 class="card-title">1. Datos de cotización</h3></div><div class="card-body"><div class="row g-2"><div class="col-7"><label class="form-label" for="numero">Número</label><input class="form-control" id="numero" required maxlength="40"></div><div class="col-5"><label class="form-label" for="moneda">Moneda</label><select class="form-select" id="moneda"><option>CLP</option><option>UF</option></select></div><div class="col-12"><label class="form-label" for="obraSearch">Empresa y obra</label><div class="input-group"><input class="form-control" id="obraSearch" placeholder="Buscar obra o dirección"><button class="btn" type="button" id="find">Buscar</button></div><select class="form-select mt-2" id="obra" required></select></div></div></div></div>
<div class="card mb-3"><div class="card-header"><h3 class="card-title">2. Servicios</h3><div class="card-actions"><button class="btn btn-sm btn-outline-primary" type="button" id="add">+ Agregar</button></div></div><div class="list-group list-group-flush" id="lines"></div><div class="card-footer text-secondary">Cantidad vacía = servicio abierto, sin total definido.</div></div>
<div class="card mb-3"><div class="card-header"><h3 class="card-title">3. Resumen económico</h3></div><div class="card-body"><div class="d-flex justify-content-between"><span>Subtotal determinado</span><strong id="subtotal">—</strong></div><div class="d-flex justify-content-between mt-2"><span>IVA estimado (19%)</span><span id="iva">—</span></div><hr class="my-2"><div class="d-flex justify-content-between align-items-center"><strong>Total estimado</strong><strong class="h2 mb-0 text-primary" id="total">—</strong></div><div class="text-secondary small mt-2" id="summaryNote"></div></div></div>
<div class="card mb-3"><div class="card-header"><h3 class="card-title">4. Condiciones comerciales</h3></div><div class="card-body"><textarea class="form-control" id="condiciones" rows="3" aria-label="Condiciones comerciales" placeholder="Plazos, condiciones de pago u observaciones"></textarea></div><div class="card-footer d-flex gap-2 justify-content-end"><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn btn-primary" type="submit">Guardar borrador</button></div></div></form>
<section class="card mb-3" id="detail" hidden></section><div class="card"><div class="card-header"><h3 class="card-title">Cotizaciones registradas</h3></div><div class="card-body"><input class="form-control" id="search" placeholder="Buscar cotización, empresa u obra"></div><div id="list"></div></div></main><script src="./pagination.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let services=[];
function node(tag,cls='',txt=''){const n=document.createElement(tag);n.className=cls;n.textContent=txt;return n;}
function msg(t){$('notice').textContent=t;}
async function request(path,options={}){const r=await fetch('./api'+path,{credentials:'same-origin',cache:'no-store',...options});const b=await r.json();if(!r.ok)throw Error(b.error||'Error de servidor');return b;}
async function write(path,method,data){const s=await request('/session',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});return request(path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':s.csrf},body:JSON.stringify({...data,csrf:s.csrf})});}
function summary(){let sum=0,open=0,missing=0;for(const row of $('lines').children){const q=row.querySelector('[data-qty]').value,p=row.querySelector('[data-price]').value;if(p==='')missing++;else if(q==='')open++;else sum+=Number(q)*Number(p);}const currency=$('moneda').value;const fmt=v=>currency==='CLP'?'CLP '+Math.round(v).toLocaleString('es-CL'):v.toLocaleString('es-CL',{minimumFractionDigits:4,maximumFractionDigits:4})+' UF';$('subtotal').textContent=fmt(sum);$('iva').textContent=fmt(sum*.19);$('total').textContent=fmt(sum*1.19);$('summaryNote').textContent=[open?open+' servicio(s) con cantidad abierta, excluidos del total.':'',missing?'Hay tarifas no disponibles.':'','IVA referencial, no guardado en la cotización.'].filter(Boolean).join(' ');}
function line(){const row=node('div','list-group-item');const grid=node('div','row g-2 align-items-end');const sel=node('select','form-select');sel.required=true;const used=new Set(Array.from($('lines').querySelectorAll('select'),x=>x.value));const blank=node('option','','Seleccionar servicio');blank.value='';sel.append(blank);for(const s of services.filter(x=>Number(x.activo))){const opt=node('option','',s.nombre);opt.value=s.id;sel.append(opt);}const first=Array.from(sel.options).find(x=>x.value&&!used.has(x.value));if(first)sel.value=first.value;const qty=node('input','form-control');qty.type='number';qty.min=1;qty.max=100000;qty.placeholder='Abierta';qty.dataset.qty='';qty.oninput=summary;const price=node('input','form-control bg-light');price.type='text';price.readOnly=true;price.dataset.price='';price.placeholder='Sin tarifa';const update=()=>{const s=services.find(x=>String(x.id)===sel.value);price.value=s?.[$('moneda').value==='CLP'?'precio_clp':'precio_uf']??'';price.classList.toggle('is-invalid',price.value==='');summary();};sel.onchange=update;const remove=node('button','btn btn-outline-danger btn-icon','×');remove.type='button';remove.title='Quitar servicio';remove.setAttribute('aria-label','Quitar servicio');remove.onclick=()=>{row.remove();summary();};for(const [label,control,cls] of [['Servicio',sel,'col-10 col-md-5'],['',remove,'col-2 col-md-1 order-md-last'],['Cantidad',qty,'col-5 col-md-3'],['Precio unitario',price,'col-7 col-md-3']]){const col=node('div',cls);if(label)col.append(node('label','form-label mb-1',label));col.append(control);grid.append(col);}row.append(grid);row.read=()=>{if(!sel.value||price.value==='')throw Error('Selecciona un servicio con tarifa disponible.');return {servicio_id:Number(sel.value),cantidad:qty.value?Number(qty.value):null};};$('lines').append(row);update();}
$('add').onclick=line;$('cancel').onclick=()=>$('form').hidden=true;$('new').onclick=async()=>{try{services=(await request('/catalogo/servicios')).servicios;$('form').reset();$('lines').replaceChildren();$('obra').replaceChildren();line();$('form').hidden=false;}catch(e){msg(e.message);}};
$('moneda').onchange=()=>{for(const row of $('lines').children)row.querySelector('select').onchange();summary();};
$('find').onclick=async()=>{try{const result=await request('/catalogo/obras?per_page=30&search='+encodeURIComponent($('obraSearch').value));$('obra').replaceChildren();for(const w of result.data.filter(x=>Number(x.activo))){const opt=node('option','',w.empresa+' · '+w.nombre);opt.value=w.id;$('obra').append(opt);}}catch(e){msg(e.message);}};
$('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const q=await write('/cotizaciones','POST',{numero:$('numero').value,obra_id:Number($('obra').value),moneda:$('moneda').value,condiciones:$('condiciones').value,servicios:Array.from($('lines').children,x=>x.read())});$('form').hidden=true;await pager.load(1);await detail(q.id);}catch(e){msg(e.message);}finally{b.disabled=false;}};
async function detail(id){try{const q=await request('/cotizaciones/'+id),root=$('detail');root.replaceChildren();root.hidden=false;const body=node('div','card-body');body.append(node('h2','',q.numero+' · '+q.estado),node('p','',q.empresa+' · '+q.obra+' · '+q.moneda));for(const s of q.servicios)body.append(node('p','',s.nombre+' · '+(s.cantidad??'Abierta')+' × '+s.precio_unitario+' · Asignadas: '+s.asignada));for(const o of q.ordenes)body.append(node('p','','OT '+o.numero_ot+' · '+o.estado));const next=q.estado==='borrador'?['enviada']:q.estado==='enviada'?['aprobada','rechazada']:[];for(const state of next){const b=node('button','btn me-2','Marcar '+state);b.onclick=async()=>{b.disabled=true;try{await write('/cotizaciones/'+id+'/estado','PUT',{estado:state});await detail(id);await pager.load();}catch(e){msg(e.message);b.disabled=false;}};body.append(b);}if(q.estado==='aprobada'){const link=node('a','btn btn-primary','Generar OT');link.href='./planificador.html?cotizacion='+encodeURIComponent(q.numero);body.append(link);}root.append(body);}catch(e){msg(e.message);}}
const pager=new ControlabPagination({root:$('list'),request,endpoint:'/cotizaciones',params:()=>({search:$('search').value}),render(rows){const table=node('table','table table-vcenter');const body=node('tbody');for(const q of rows){const tr=node('tr');const td=node('td');td.append(node('strong','',q.numero),node('div','text-secondary',q.empresa+' · '+q.obra));const state=node('td','',q.estado);const action=node('td');const b=node('button','btn btn-sm','Ver');b.onclick=()=>detail(q.id);action.append(b);tr.append(td,state,action);body.append(tr);}table.append(body);$('list').append(table);}});let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>pager.load(1),250);};pager.load();
</script><script src="./tabler-shell.js?v=5" defer></script></body></html>
